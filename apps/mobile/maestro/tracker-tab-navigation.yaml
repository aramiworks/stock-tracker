appId: so.arami.stocktracker.app
url: ${MAESTRO_APP_URL}
name: Tracker - Tab Navigation
tags:
  - authenticated
---
# Cycle the three live bottom tabs (catalog / watchlist / history) and assert
# each container renders. INF-1391 reshaped the nav to drop the Alerts tab
# (parked in `_archived_eligibility`) and lead with Catalog (the Shengsho
# entry point). Account remains hidden via `href: null`.

- launchApp

# Default landing tab — catalog
- tapOn: "카탈로그"
- assertVisible:
    id: "catalog-browse-screen"

# Watchlist tab (관심목록)
- tapOn: "관심목록"
- assertVisible:
    id: "accounts-list-screen"

# History tab (알림내역)
- tapOn: "알림내역"
- assertVisible:
    id: "history-browse-screen"

# Cycle back to catalog to confirm bidirectional navigation
- tapOn: "카탈로그"
- assertVisible:
    id: "catalog-browse-screen"
