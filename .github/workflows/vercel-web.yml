name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - master
          - stage
          - develop
        default: master

concurrency:
  group: web-${{ github.ref }}-${{ inputs.environment || 'master' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@aramiworks"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}

      - name: Build packages
        run: npx turbo run build --filter=@stock-tracker/validation --filter=@stock-tracker/types

      - uses: dopplerhq/cli-action@v3

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ inputs.environment || 'master' }}"
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          if [[ "$ENV" == "master" ]]; then
            echo "project_id=${{ secrets.VERCEL_WEB_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "domain=app.stocktracker.arami.so" >> "$GITHUB_OUTPUT"
          elif [[ "$ENV" == "develop" ]]; then
            echo "project_id=${{ secrets.VERCEL_WEB_DEVELOP_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "domain=develop.app.stocktracker.arami.so" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ secrets.VERCEL_WEB_STAGE_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "domain=stage.app.stocktracker.arami.so" >> "$GITHUB_OUTPUT"
          fi

      - name: Export web
        run: doppler run -- npx expo export --platform web
        working-directory: apps/mobile
        env:
          DOPPLER_TOKEN: ${{ steps.env.outputs.name == 'develop' && secrets.DOPPLER_TOKEN_DEVELOP || steps.env.outputs.name == 'stage' && secrets.DOPPLER_TOKEN_STAGE || secrets.DOPPLER_TOKEN_MASTER }}
          APP_ENV: ${{ steps.env.outputs.name }}

      - name: Write Vercel config
        run: printf '{"github":{"enabled":false},"rewrites":[{"source":"/(.*)","destination":"/index.html"}]}\n' > apps/mobile/dist/vercel.json

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.env.outputs.project_id }}
        run: |
          cp -r apps/mobile/dist /tmp/vercel-dist
          mkdir -p /tmp/vercel-dist/.vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg proj "$VERCEL_PROJECT_ID" \
            '{"orgId":$org,"projectId":$proj}' > /tmp/vercel-dist/.vercel/project.json
          DEPLOY_URL=$(npx vercel deploy /tmp/vercel-dist --yes --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "### Web deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://${{ steps.env.outputs.domain }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          STATUS="${{ job.status == 'success' && '✅' || '❌' }}"
          ENV="${{ steps.env.outputs.name }}"
          DOMAIN="${{ steps.env.outputs.domain }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${{ vars.SLACK_CHANNEL_ENGINEERING_UPDATES }}\",
              \"text\": \"${STATUS} *Web Deploy* — ${ENV}\n🌐 https://${DOMAIN}\n🔗 <${RUN_URL}|View run>\"
            }"
