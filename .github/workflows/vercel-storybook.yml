name: Deploy Storybook

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/src/**/*.story.tsx"
      - "apps/storybook/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - master
          - stage
          - develop
        default: master

concurrency:
  group: storybook-${{ github.ref }}-${{ inputs.environment || 'master' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@aramiworks"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}

      - name: Build packages
        run: npx turbo run build --filter=@stock-tracker/validation --filter=@stock-tracker/types

      - name: Build Storybook
        run: npx turbo run build --filter=@stock-tracker/storybook

      - name: Write Vercel config
        run: printf '{"github":{"enabled":false},"cleanUrls":true}\n' > apps/storybook/storybook-static/vercel.json

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ inputs.environment || 'master' }}"
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          if [[ "$ENV" == "master" ]]; then
            echo "project_id=${{ secrets.VERCEL_STORYBOOK_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "domain=storybook.stocktracker.arami.so" >> "$GITHUB_OUTPUT"
          elif [[ "$ENV" == "develop" ]]; then
            echo "project_id=${{ secrets.VERCEL_STORYBOOK_DEVELOP_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "domain=develop.storybook.stocktracker.arami.so" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ secrets.VERCEL_STORYBOOK_STAGE_PROJECT_ID }}" >> "$GITHUB_OUTPUT"
            echo "domain=stage.storybook.stocktracker.arami.so" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.env.outputs.project_id }}
        run: |
          cp -r apps/storybook/storybook-static /tmp/vercel-dist
          mkdir -p /tmp/vercel-dist/.vercel
          jq -n --arg org "$VERCEL_ORG_ID" --arg proj "$VERCEL_PROJECT_ID" \
            '{"orgId":$org,"projectId":$proj}' > /tmp/vercel-dist/.vercel/project.json
          DEPLOY_URL=$(npx vercel deploy /tmp/vercel-dist --yes --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "### Storybook deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://${{ steps.env.outputs.domain }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          STATUS="${{ job.status == 'success' && '✅' || '❌' }}"
          ENV="${{ steps.env.outputs.name }}"
          DOMAIN="${{ steps.env.outputs.domain }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${{ vars.SLACK_CHANNEL_ENGINEERING_UPDATES }}\",
              \"text\": \"${STATUS} *Storybook Deploy* — ${ENV}\n📖 https://${DOMAIN}\n🔗 <${RUN_URL}|View run>\"
            }"
