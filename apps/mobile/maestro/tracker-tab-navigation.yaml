url: ${MAESTRO_APP_URL}
name: Tracker - Tab Navigation
tags:
  - authenticated
---
# Canonical 4-tab bottom nav (INF-1610 — Figma INF-1605/INF-1621):
# Watchlist · Catalog · History · Account. Catalog is now a permanent tab and
# is still also reachable via the "+ 추가" entry point on the Watchlist screen.

- runFlow: helpers/launch-authenticated.yaml

# Watchlist tab is the default landing tab.
- assertVisible:
    id: "watchlist-list-screen"

# All four tabs render in the bottom bar.
- assertVisible: "관심목록"
- assertVisible: "카탈로그"
- assertVisible: "내역"
- assertVisible: "계정"

# Catalog tab → catalog browse screen.
- tapOn: "카탈로그"
- assertVisible:
    id: "catalog-browse-screen"

# History tab (내역 — INF-1478 alert-history browse).
- tapOn: "내역"
- assertVisible:
    id: "alert-history-screen"

# Account tab → account home screen.
- tapOn: "계정"
- assertVisible:
    id: "account-home-screen"

# Back to watchlist via the Watchlist tab.
- tapOn: "관심목록"
- assertVisible:
    id: "watchlist-list-screen"

# Catalog is also reachable via the "+ 추가" entry point on the watchlist header.
- tapOn:
    id: "watchlist-add-products-button"
- assertVisible:
    id: "catalog-browse-screen"
