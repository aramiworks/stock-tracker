type WatchableUnit @key(fields: "id") {
  id: ID!
  brand: String!
  productLine: String!
  modelName: String!
  imageUrl: String
  active: Boolean!
  skus: [Sku!]!
}

type Sku @key(fields: "id") {
  id: ID!
  color: String!
  leather: String
  hardware: String
  size: String
  referenceCode: String
  imageUrl: String
  active: Boolean!
}

type Watch @key(fields: "id") {
  id: ID!
  watchableUnitId: ID!
  skuId: ID
  notifyPush: Boolean!
  notifyEmail: Boolean!
  active: Boolean!
  createdAt: String!
  watchableUnit: WatchableUnit!
  sku: Sku
}

type Alert {
  id: ID!
  watchId: ID!
  channel: String!
  sentAt: String
  readAt: String
  createdAt: String!
  dropEvent: DropEvent!
}

type DropEvent {
  id: ID!
  skuId: ID!
  sourceUrl: String
  detectedAt: String!
}

type DashboardSummary {
  activeWatches: Int!
  unreadAlerts: Int!
  recentDrops: Int!
}

type CatalogPage {
  items: [WatchableUnit!]!
  nextCursor: ID
}

"""
Minimal WatchableUnit shape returned by Query.catalogList — used for the
Shengsho-style catalog browse UI which doesn't need SKUs or timestamps.
"""
type CatalogListUnit {
  id: ID!
  brand: String!
  productLine: String!
  modelName: String!
}

"""
A group of catalog units sharing the same (brand, productLine).
"""
type CatalogListGroup {
  brand: String!
  productLine: String!
  units: [CatalogListUnit!]!
}

type AlertFeed {
  items: [Alert!]!
  nextCursor: ID
}

input CreateWatchInput {
  watchableUnitId: ID!
  skuId: ID
  notifyPush: Boolean
  notifyEmail: Boolean
}

input UpdateWatchInput {
  id: ID!
  notifyPush: Boolean
  notifyEmail: Boolean
  active: Boolean
}

type Query

extend type Query {
  """
  Dashboard overview for the current user
  """
  dashboard: DashboardSummary!

  """
  Browse the product catalog
  """
  catalog(
    brand: String
    productLine: String
    search: String
    activeOnly: Boolean
    cursor: ID
    limit: Int
  ): CatalogPage!

  """
  Get a single catalog item by ID
  """
  catalogItem(id: ID!): WatchableUnit

  """
  Anonymous-readable catalog grouped by (brand, productLine). Used by the
  Shengsho-style catalog browse UI so users can browse before signing in.
  """
  catalogList: [CatalogListGroup!]!

  """
  List the current user's watches
  """
  watches: [Watch!]!

  """
  List alerts for the current user
  """
  alerts(unreadOnly: Boolean, cursor: ID, limit: Int): AlertFeed!

  """
  Count of unread alerts
  """
  unreadAlertCount: Int!
}

extend type Mutation {
  createWatch(input: CreateWatchInput!): Watch!
  updateWatch(input: UpdateWatchInput!): Watch!
  deleteWatch(id: ID!): Boolean!
  markAlertRead(id: ID!): Boolean!
}
