url: ${MAESTRO_APP_URL}
name: Tracker - Tab Navigation
tags:
  - authenticated
---
# Shengsho-strict 2-tab nav (INF-1391 — Jace decision). Bottom bar collapses to
# Watchlist + History. Catalog is no longer a top-level tab — it's reached via
# the "+ 추가" entry point on the Watchlist screen.

- runFlow: helpers/launch-authenticated.yaml

# Watchlist tab is the default landing tab.
- assertVisible:
    id: "watchlist-list-screen"

# Exactly the two configured tabs render — Catalog must NOT be visible in the
# bottom bar (it's `href: null` per (app)/_layout.tsx).
- assertVisible: "관심목록"
- assertVisible: "내역"
- assertNotVisible: "카탈로그"

# History tab (내역 — INF-1478 alert-history browse)
- tapOn: "내역"
- assertVisible:
    id: "alert-history-screen"

# Back to watchlist
- tapOn: "관심목록"
- assertVisible:
    id: "watchlist-list-screen"

# Catalog is reachable via the "+ 추가" entry point on the watchlist header.
- tapOn:
    id: "watchlist-add-products-button"
- assertVisible:
    id: "catalog-browse-screen"
