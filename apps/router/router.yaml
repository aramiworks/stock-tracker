# Apollo Router configuration
# JWT validation via Supabase JWKS
authentication:
  router:
    jwt:
      jwks:
        - url: ${env.SUPABASE_JWKS_URL}

# Rhai script extracts JWT claims (sub → x-user-id, role → x-user-role) and
# sets them as headers on every outgoing subgraph request.
# from_context only supports top-level context keys (no nested field access),
# so a Rhai script is required to extract individual claims.
rhai:
  scripts: "./rhai"
  main: "main.rhai"

# Propagate non-JWT headers to all subgraphs
headers:
  all:
    request:
      - propagate:
          named: x-request-id
      - propagate:
          named: authorization

cors:
  origins:
    - http://localhost:8081
    - http://localhost:8092
    - http://localhost:8093
    - http://localhost:8094
    - http://localhost:4012
    - http://localhost:19006
    - ${env.CORS_ORIGIN:-http://localhost:8081}
  allow_headers:
    - authorization
    - content-type
    - x-user-id
    - x-user-role
    - x-request-id

supergraph:
  introspection: true
  listen: 0.0.0.0:${env.PORT:-4002}

homepage:
  enabled: false

sandbox:
  enabled: true
