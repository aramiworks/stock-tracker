# Helper: Launch app in authenticated state (web target)
#
# Gmail OAuth cannot be fully automated in Maestro (Google blocks WebView-based
# sign-in from automated tools). Instead, authenticated flows rely on a Supabase
# session injected into the served `dist/index.html`'s localStorage by
# `scripts/e2e-inject-session.mjs` BEFORE Maestro runs. By the time `launchApp`
# navigates to `${MAESTRO_APP_URL}`, the session is already present and Supabase
# auth hydrates as signed-in.
#
# Usage: runFlow helpers/launch-authenticated.yaml
# Prerequisites:
#   1. A test user exists in Supabase auth (see fixtures/README.md)
#   2. `node scripts/e2e-inject-session.mjs` has run against `apps/mobile/dist/`

url: ${MAESTRO_APP_URL}
---
- launchApp
- waitForAnimationToEnd
