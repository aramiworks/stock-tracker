# Helper: Launch app in authenticated state
# Requires: MAESTRO_TEST_TOKEN env var set for Supabase test user
#
# Gmail OAuth cannot be fully automated in Maestro (Google blocks WebView-based
# sign-in from automated tools). Instead, authenticated flows rely on a pre-seeded
# Supabase session token injected via deep link or AsyncStorage manipulation.
#
# Usage: runFlow helpers/launch-authenticated.yaml
# Prerequisites:
#   1. A test user exists in Supabase auth (see fixtures/README.md)
#   2. The app is built with E2E_MODE=true (enables session injection endpoint)

appId: so.arami.stocktracker.app
---
- launchApp:
    arguments:
      e2eToken: ${MAESTRO_TEST_TOKEN}
- waitForAnimationToEnd
