procs:
  supabase:
    cmd:
      [
        "doppler",
        "run",
        "--project",
        "stock-tracker",
        "--config",
        "local",
        "--",
        "bash",
        "scripts/supabase-local.sh",
      ]
    stop: "SIGTERM"
    autostart: true

  tracker-service:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${TRACKER_SERVICE_PORT:-4020} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- node --watch --loader ts-node/esm src/main.ts",
      ]
    cwd: apps/services/tracker
    env:
      PORT: "4020"
    stop: "SIGTERM"
    autostart: true

  auth-service:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${AUTH_SERVICE_PORT:-4030} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- node --watch --loader ts-node/esm src/main.ts",
      ]
    cwd: apps/services/auth
    env:
      PORT: "4030"
    stop: "SIGTERM"
    autostart: true

  subgraph-tracker:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${SUBGRAPH_TRACKER_PORT:-4011} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- npx tsx watch src/server.ts",
      ]
    cwd: apps/subgraphs/tracker
    env:
      PORT: "4011"
      TRPC_TRACKER_SERVICE_URL: "http://localhost:4020/trpc"
    stop: "SIGTERM"
    autostart: true

  subgraph-auth:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${SUBGRAPH_AUTH_PORT:-4013} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- npx tsx watch src/server.ts",
      ]
    cwd: apps/subgraphs/auth
    env:
      PORT: "4013"
      TRPC_AUTH_SERVICE_URL: "http://localhost:4030/trpc"
    stop: "SIGTERM"
    autostart: true

  router:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${ROUTER_PORT:-4012} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- rover dev --supergraph-config supergraph.yaml --router-config router.yaml --supergraph-port ${ROUTER_PORT:-4012}",
      ]
    cwd: apps/router
    stop: "SIGTERM"
    autostart: true

  ios:
    cmd:
      [
        "doppler",
        "run",
        "--project",
        "stock-tracker",
        "--config",
        "local",
        "--",
        "sh",
        "-c",
        "lsof -ti :${IOS_PORT:-8092} | xargs kill 2>/dev/null; npx expo prebuild --clean --platform ios && npx expo run:ios --port ${IOS_PORT:-8092}",
      ]
    cwd: apps/mobile
    env:
      APP_ENV: "local"
    stop: "SIGTERM"
    autostart: true

  android:
    cmd:
      [
        "doppler",
        "run",
        "--project",
        "stock-tracker",
        "--config",
        "local",
        "--",
        "sh",
        "-c",
        "lsof -ti :${ANDROID_PORT:-8093} | xargs kill 2>/dev/null; npx expo prebuild --clean --platform android && npx expo run:android --port ${ANDROID_PORT:-8093}",
      ]
    cwd: apps/mobile
    env:
      APP_ENV: "local"
    stop: "SIGTERM"
    autostart: true

  web:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${WEB_PORT:-8094} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- npx expo start --port ${WEB_PORT:-8094} --web --clear",
      ]
    cwd: apps/mobile
    env:
      APP_ENV: "local"
    stop: "SIGTERM"
    autostart: true

  storybook:
    cmd:
      [
        "sh",
        "-c",
        "lsof -ti :${STORYBOOK_PORT:-6006} | xargs kill 2>/dev/null; doppler run --project stock-tracker --config local -- npx storybook dev -p ${STORYBOOK_PORT:-6006}",
      ]
    cwd: apps/storybook
    env:
      BROWSER: "open"
    stop: "SIGTERM"
    autostart: true
