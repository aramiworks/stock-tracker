appId: so.arami.stocktracker.app
url: ${MAESTRO_APP_URL}
name: Tracker - Account - Home
tags:
  - authenticated
---
- launchApp
- assertVisible:
    id: "dashboard-home-screen"
- tapOn:
    id: "profile-avatar"
- assertVisible:
    id: "account-home-screen"
- assertVisible:
    id: "account-home-top-bar"
- assertVisible: "계정"
- assertVisible:
    id: "account-info-card"
- assertVisible: "이메일"
- assertVisible: "가입일"
- assertVisible:
    id: "sign-out-button"
- assertVisible: "로그아웃"
- assertVisible:
    id: "version-footer"
- tapOn:
    id: "sign-out-button"
- assertVisible:
    id: "auth-signIn-gmailOauth-screen"
- assertVisible: "Sign in with Google"
