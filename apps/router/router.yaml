# Apollo Router configuration
# JWT validation via Supabase JWKS
# (smoke test for INF-1148 changeset-fix autofix — safe to revert)
authentication:
  router:
    jwt:
      jwks:
        - url: ${env.SUPABASE_JWKS_URL}

rhai:
  scripts: /dist/config/rhai
  main: main.rhai

# Propagate client headers; JWT claims → x-user-id/x-user-role is handled by the Rhai plugin.
headers:
  all:
    request:
      - propagate:
          named: x-request-id
      - propagate:
          named: authorization

cors:
  origins:
    - http://localhost:8081
    - http://localhost:8092
    - http://localhost:8093
    - http://localhost:8094
    - http://localhost:4012
    - http://localhost:19006
    - ${env.ALLOWED_ORIGINS}
  allow_headers:
    - authorization
    - content-type
    - x-user-id
    - x-user-role
    - x-request-id

supergraph:
  introspection: true
  listen: 0.0.0.0:${env.ROUTER_PORT}

homepage:
  enabled: false

sandbox:
  enabled: true
