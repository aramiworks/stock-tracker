name: Backend Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "develop"
        type: choice
        options: [develop, stage, master]

concurrency:
  group: backend-docker-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: auth-service
            package: "@stock-tracker/auth-service"
            dir: apps/services/auth
            dockerfile: infra/docker/node-service.Dockerfile
            entrypoint: dist/main.js
          - service: tracker-service
            package: "@stock-tracker/tracker-service"
            dir: apps/services/tracker
            dockerfile: infra/docker/node-service.Dockerfile
            entrypoint: dist/main.js
          - service: subgraph-tracker
            package: "@stock-tracker/subgraph-tracker"
            dir: apps/subgraphs/tracker
            dockerfile: infra/docker/node-service.Dockerfile
            entrypoint: dist/server.js
          - service: subgraph-auth
            package: "@stock-tracker/subgraph-auth"
            dir: apps/subgraphs/auth
            dockerfile: infra/docker/node-service.Dockerfile
            entrypoint: dist/server.js
          - service: router
            package: ""
            dir: ""
            dockerfile: apps/router/Dockerfile
            entrypoint: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/stock-tracker-${{ matrix.service }}"
          ENV_TAG="${{ inputs.environment }}"
          echo "tags=${IMAGE}:${SHA},${IMAGE}:${ENV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve build args
        id: build-args
        if: matrix.package != ''
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "args<<$EOF" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_NAME=${{ matrix.package }}" >> "$GITHUB_OUTPUT"
          echo "APP_DIR=${{ matrix.dir }}" >> "$GITHUB_OUTPUT"
          echo "ENTRYPOINT_FILE=${{ matrix.entrypoint }}" >> "$GITHUB_OUTPUT"
          echo "SENTRY_RELEASE=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract compiled JS + .map files from the just-pushed image so
      # @sentry/cli can associate them with the release ($GITHUB_SHA).
      # initSentry() reads SENTRY_RELEASE from env at runtime — these must
      # match for Sentry to symbolicate stack traces.
      - name: Extract source maps from image
        if: matrix.service == 'auth-service'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/stock-tracker-${{ matrix.service }}:${{ github.sha }}"
          docker pull "$IMAGE"
          docker create --name extract "$IMAGE"
          mkdir -p sourcemaps
          docker cp extract:/app/${{ matrix.dir }}/dist sourcemaps/dist
          docker rm extract

      - name: Upload source maps to Sentry
        if: matrix.service == 'auth-service'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: auth-service
        with:
          version: ${{ github.sha }}
          sourcemaps: sourcemaps/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install redeploy deps
        run: npm install --prefix infra/railway

      - name: Trigger Railway redeploy
        run: npx --prefix infra/railway tsx infra/railway/src/redeploy.ts ${{ inputs.environment }}
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
